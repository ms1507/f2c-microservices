server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rural_marketplace_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: users
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: users
    default-schema: users
    create-schemas: true

