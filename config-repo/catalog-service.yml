server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rural_marketplace_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: catalog
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: catalog
    default-schema: catalog
    create-schemas: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
