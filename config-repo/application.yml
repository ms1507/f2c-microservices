# --- Shared Global Configuration ---
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


spring:
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

# --- End of Shared Global Configuration ---

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
