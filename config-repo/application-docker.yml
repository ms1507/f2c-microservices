# --- Docker Profile Configuration ---
# This file overrides localhost settings with container service names for use within Docker networks.

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  data:
    redis:
      host: redis
      port: 6379
  
  datasource:
    url: jdbc:postgresql://postgres:5432/rural_marketplace_db
  
  kafka:
    bootstrap-servers: kafka:29092

# --- End of Docker Configuration ---
