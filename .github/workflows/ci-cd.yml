name: Rural Marketplace CI/CD

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean install -DskipTests

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Images
      run: |
        services=("config-service" "discovery-service" "api-gateway" "user-service" "catalog-service" "order-service" "notification-service")
        for service in "${services[@]}"; do
          echo "Building and pushing $service..."
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rural-$service:latest -f $service/Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rural-$service:latest
        done
